---
- name: Podman | Validate inputs
  ansible.builtin.assert:
    that:
      - podman_state in ['present', 'latest', 'absent']
      - ansible_os_family == 'Debian'
    fail_msg: "podman_state must be present, latest or absent, and this role supports Debian/Ubuntu only"
    quiet: true

- name: Podman | Look up target user
  ansible.builtin.getent:
    database: passwd
    key: "{{ podman_user }}"

- name: Podman | Set user facts
  ansible.builtin.set_fact:
    podman_uid: "{{ getent_passwd[podman_user][1] }}"
    podman_home: "{{ getent_passwd[podman_user][4] }}"

- name: Podman | Remove podman
  ansible.builtin.include_tasks: uninstall.yaml
  when: podman_state == 'absent'

- name: Podman | Install or update podman
  ansible.builtin.include_tasks: install.yaml
  when: podman_state != 'absent'
