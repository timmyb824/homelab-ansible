---
- name: Bin | Assert supported platform
  ansible.builtin.assert:
    that:
      - ansible_system | lower in ["darwin", "linux"]
      - ansible_architecture in ["x86_64", "aarch64", "arm64"]
    fail_msg: "bin role supports darwin/linux on x86_64 and arm64/aarch64 only (found {{ ansible_system }}/{{ ansible_architecture }})"
    quiet: true

- name: Bin | Map OS and architecture to release asset naming
  ansible.builtin.set_fact:
    bin_os: "{{ ansible_system | lower }}"
    bin_arch: "{{ bin_arch_map[ansible_architecture] }}"
  vars:
    bin_arch_map:
      x86_64: amd64
      aarch64: arm64
      arm64: arm64

- name: Bin | Build release asset name
  ansible.builtin.set_fact:
    bin_asset_name: "bin_{{ bin_version }}_{{ bin_os }}_{{ bin_arch }}"

- name: Bin | Build release download URL
  ansible.builtin.set_fact:
    bin_download_url: "https://github.com/marcosnils/bin/releases/download/v{{ bin_version }}/{{ bin_asset_name }}"

- name: Bin | Include OS-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}.yaml"

- name: Bin | Install and configure bin
  when: bin_state == "present"
  block:
    - name: Bin | Ensure install directory exists
      ansible.builtin.file:
        path: "{{ bin_install_dir }}"
        state: directory
        mode: "0755"

    - name: Bin | Download release checksums
      ansible.builtin.get_url:
        url: "https://github.com/marcosnils/bin/releases/download/v{{ bin_version }}/checksums.txt"
        dest: /tmp/bin_checksums.txt
        mode: "0644"

    - name: Bin | Read checksums on remote host
      ansible.builtin.slurp:
        path: /tmp/bin_checksums.txt
      register: bin_checksums_slurp

    - name: Bin | Extract checksum for asset
      ansible.builtin.set_fact:
        bin_checksum: "{{ (bin_checksums_slurp.content | b64decode | regex_search('([a-f0-9]{64})\\s+' + bin_asset_name, '\\1') | first) | default('') }}"

    - name: Bin | Verify checksum was found
      ansible.builtin.assert:
        that:
          - bin_checksum | length > 0
        fail_msg: "Could not find checksum for {{ bin_asset_name }} in checksums.txt"
        quiet: true

    - name: Bin | Ensure bin config directory exists
      ansible.builtin.file:
        path: "{{ bin_config_file | dirname }}"
        state: directory
        mode: "0755"

    - name: Bin | Seed bin config with default download path
      ansible.builtin.copy:
        dest: "{{ bin_config_file }}"
        content: |
          {
              "default_path": "{{ bin_install_dir }}",
              "bins": {}
          }
        mode: "0644"
        force: false

    - name: Bin | Download bin release binary
      ansible.builtin.get_url:
        url: "{{ bin_download_url }}"
        dest: "/tmp/{{ bin_asset_name }}"
        mode: "0755"
        checksum: "sha256:{{ bin_checksum }}"

    - name: Bin | Install bin so it is managed by itself
      ansible.builtin.command:
        cmd: "/tmp/{{ bin_asset_name }} install github.com/marcosnils/bin {{ bin_install_dir }}/"
        creates: "{{ bin_install_dir }}/bin"
      environment:
        GITHUB_AUTH_TOKEN: "{{ bin_github_token }}"

    - name: Bin | Verify bin installation
      ansible.builtin.command: "{{ bin_install_dir }}/bin ls"
      register: bin_ls
      changed_when: false

    - name: Bin | Assert bin is tracked by itself
      ansible.builtin.assert:
        that:
          - "'bin' in bin_ls.stdout"
        fail_msg: "bin was not installed correctly; 'bin ls' does not list it"
        quiet: true

    - name: Bin | Remove bootstrap download and checksums
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ bin_asset_name }}"
        - /tmp/bin_checksums.txt

    - name: Bin | Fetch packages list
      ansible.builtin.uri:
        url: "{{ bin_packages_gist_url }}"
        return_content: true
        validate_certs: true
        method: GET
      register: bin_packages_list
      become: false
      delegate_to: localhost
      run_once: true
      when: bin_install_packages | bool

    - name: Bin | Parse packages list
      ansible.builtin.set_fact:
        bin_packages: >-
          {{ bin_packages_list.content.split('\n') | map('trim') | reject('search', '^#')
             | map('split', '#') | map('first') | map('trim') | reject('equalto', '') | list }}
      when: bin_install_packages | bool and bin_packages_list is defined and bin_packages_list.content is defined

    - name: Bin | Verify packages list is not empty
      ansible.builtin.fail:
        msg: "No packages found in the packages list"
      when:
        - bin_install_packages | bool
        - bin_packages is defined
        - bin_packages | length == 0

    # Note: bin exits non-zero (file exists) when a package is already
    # installed, so re-runs are safe and simply skip existing packages.
    - name: Bin | Install packages from list
      ansible.builtin.command:
        cmd: "{{ bin_install_dir }}/bin install {{ item }} {{ bin_install_dir }}/"
      register: bin_packages_install
      loop: "{{ bin_packages }}"
      changed_when: bin_packages_install.rc == 0
      failed_when: false
      environment:
        GITHUB_AUTH_TOKEN: "{{ bin_github_token }}"
      when: bin_install_packages | bool and bin_packages is defined

    - name: Bin | Debug package installation results
      ansible.builtin.debug:
        msg: "Failed to install {{ item.item }}: {{ item.stderr }}"
      loop: "{{ bin_packages_install.results }}"
      when:
        - bin_install_packages | bool
        - bin_packages_install is defined
        - item.rc != 0
        - "'file exists' not in item.stderr"

- name: Bin | Uninstall bin
  when: bin_state == "absent"
  block:
    - name: Bin | Remove bin binary
      ansible.builtin.file:
        path: "{{ bin_install_dir }}/bin"
        state: absent

    - name: Bin | Remove bin config
      ansible.builtin.file:
        path: "{{ bin_config_file }}"
        state: absent
